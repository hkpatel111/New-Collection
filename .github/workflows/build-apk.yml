name: Build LendMate APK

# Manual trigger from the Actions tab, plus auto-build on pushes to main/master
# and on version tags (v*) — tags also publish the APK to a GitHub Release.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Android Gradle Plugin needs JDK 17+
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify zip exists
        run: |
          if [ ! -f lendmate-source.zip ]; then
            echo "::error::lendmate-source.zip repo root me nahi mila!"
            exit 1
          fi
          ls -lh lendmate-source.zip

      - name: Extract source code
        run: |
          mkdir -p app-src
          unzip -q lendmate-source.zip -d app-src
          # Agar zip ne ek hi root folder me sab rakha hai to uske andar chale jao
          if [ ! -f app-src/pubspec.yaml ]; then
            first_dir=$(find app-src -maxdepth 1 -mindepth 1 -type d | head -n1)
            if [ -f "$first_dir/pubspec.yaml" ]; then
              mv "$first_dir" app-src-new
              rm -rf app-src
              mv app-src-new app-src
            fi
          fi
          ls -la app-src
          test -f app-src/pubspec.yaml || { echo "::error::pubspec.yaml zip me nahi mila"; exit 1; }

      - name: Generate Android platform folder
        working-directory: app-src
        run: |
          flutter config --no-analytics
          flutter create . \
            --org com.lendmate \
            --project-name lendmate \
            --platforms android

      # flutter_local_notifications needs Java 8+ API desugaring on :app.
      # Works with both Groovy (build.gradle) and Kotlin DSL (build.gradle.kts)
      # templates. Modern flutter create templates ship NO top-level
      # dependencies {} block, so the dep line is appended as a new block
      # when missing. The step verifies BOTH edits landed and fails loudly
      # otherwise, so a half-patched file can never reach Gradle again.
      - name: Enable core library desugaring
        working-directory: app-src
        run: |
          node <<'EOF'
          const fs = require('fs');

          const candidates = [
            'android/app/build.gradle.kts',
            'android/app/build.gradle',
          ];
          const path = candidates.find((p) => fs.existsSync(p));
          if (!path) {
            console.log('::error::No app-level gradle file found');
            process.exit(1);
          }

          const kts = path.endsWith('.kts');
          let src = fs.readFileSync(path, 'utf8');
          const changed = [];

          const flagRe = /(?:is)?[Cc]ore[Ll]ibrary[Dd]esugaringEnabled\s*=?\s*true/;

          // 1) Enable desugaring inside compileOptions (skip if already set)
          if (!flagRe.test(src)) {
            const flag = kts ? 'isCoreLibraryDesugaringEnabled = true' : 'coreLibraryDesugaringEnabled true';
            const m = /^([ \t]*)compileOptions[ \t]*\{/m.exec(src);
            if (!m) {
              console.log('::error::compileOptions block not found - cannot enable desugaring');
              process.exit(1);
            }
            const indent = m[1] + '    ';
            src = src.slice(0, m.index + m[0].length) + '\n' + indent + flag + src.slice(m.index + m[0].length);
            changed.push('compileOptions flag');
          }

          // 2) Ensure the desugar_jdk_libs dependency exists. Only a
          // column-0 dependencies block counts; otherwise append a valid one.
          if (!src.includes('desugar_jdk_libs')) {
            const dep = kts
              ? 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              : "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'";
            const m = /^dependencies[ \t]*\{/m.exec(src);
            if (m) {
              src = src.slice(0, m.index + m[0].length) + '\n    ' + dep + src.slice(m.index + m[0].length);
              changed.push('desugar dependency (inserted into dependencies block)');
            } else {
              if (!src.endsWith('\n')) src += '\n';
              src += '\ndependencies {\n    ' + dep + '\n}\n';
              changed.push('desugar dependency (appended dependencies block)');
            }
          }

          fs.writeFileSync(path, src);

          // 3) Verify BOTH edits landed - fail loudly here, not inside Gradle
          const finalSrc = fs.readFileSync(path, 'utf8');
          const okFlag = flagRe.test(finalSrc);
          const okDep = finalSrc.includes('desugar_jdk_libs');
          if (!okFlag || !okDep) {
            console.log(`::error::Desugaring patch incomplete in ${path} (flag=${okFlag}, dep=${okDep})`);
            process.exit(1);
          }
          finalSrc.split('\n').forEach((line, i) => {
            if (/desugar/i.test(line)) console.log(`  ${i + 1}: ${line}`);
          });
          console.log(`Patched ${path}: ${changed.length ? changed.join(', ') : 'already configured'}`);
          EOF

      # Same pattern as the desugaring patch: Node script that verifies its
      # own edits and fails loudly. Silent half-patches are what broke Gradle
      # before, so every required permission is re-checked after writing.
      - name: Add required Android permissions
        working-directory: app-src
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          if (!fs.existsSync(path)) {
            console.log(`::error::AndroidManifest.xml not found at ${path}`);
            process.exit(1);
          }
          const perms = [
            'android.permission.INTERNET',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.SCHEDULE_EXACT_ALARM',
            'android.permission.USE_BIOMETRIC',
            'android.permission.USE_FINGERPRINT',
            'android.permission.CAMERA',
            'android.permission.READ_MEDIA_IMAGES',
          ];
          let src = fs.readFileSync(path, 'utf8');
          const missing = perms.filter((p) => !src.includes(p));
          if (missing.length) {
            if (!src.includes('<application')) {
              console.log('::error::No <application> tag in AndroidManifest.xml - cannot add permissions');
              process.exit(1);
            }
            const tags = missing.map((p) => `    <uses-permission android:name="${p}"/>`).join('\n') + '\n';
            src = src.replace('<application', tags + '    <application');
            fs.writeFileSync(path, src);
          }
          const finalSrc = fs.readFileSync(path, 'utf8');
          const stillMissing = perms.filter((p) => !finalSrc.includes(p));
          if (stillMissing.length) {
            console.log(`::error::Permissions patch incomplete: ${stillMissing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Permissions OK in ${path} (${missing.length} added, ${perms.length} required)`);
          EOF

      # Safety: agar flutter create ka default widget test ghusa ho (MyApp
      # exist nahi karta) to hata do — humara apna test zip me shipped hai.
      - name: Drop conflicting default widget test
        working-directory: app-src
        run: |
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
            echo "Default MyApp widget test removed"
          fi

      - name: Resolve dependencies
        working-directory: app-src
        run: flutter pub get

      # Optional: Google-services config from repo secrets (skip if not set —
      # app tab placeholder firebase_options pe Setup screen dikhayegi)
      - name: Decode google-services.json (optional secret)
        working-directory: app-src
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
            echo "google-services.json written from secret"
          else
            echo "GOOGLE_SERVICES_JSON secret set nahi hai — build placeholder options ke saath chalega."
          fi

      - name: Run unit tests
        working-directory: app-src
        run: flutter test

      - name: Analyze (warnings allowed, errors fail)
        working-directory: app-src
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: app-src
        run: flutter build apk --release

      - name: Rename APK
        working-directory: app-src
        run: |
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/LendMate-release.apk
          ls -lh ../out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LendMate-release-apk
          path: out/LendMate-release.apk
          if-no-files-found: error

      # Optional auto-release: set a tag (v*) push pe APK release ke saath attach hoga.
      - name: Attach to GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/LendMate-release.apk
